<!DOCTYPE html>
<html>
<head>
<title>UsedMart - Classifieds</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial;background:#f4f4f4;color:#333}
header{background:#2874f0;color:white;padding:20px;text-align:center}
header h1{margin-bottom:8px}
nav{background:#fff;padding:12px;text-align:center;box-shadow:0 2px 5px #bbb}
nav a{margin:0 15px;text-decoration:none;color:#2874f0;font-weight:bold}
.container{width:90%;max-width:1100px;margin:20px auto}
button{background:#2874f0;color:white;border:0;padding:12px 18px;
border-radius:5px;cursor:pointer}
button:hover{background:#1257c7}

/* Login */
#loginPage{width:350px;background:white;margin:70px auto;padding:25px;
border-radius:10px;box-shadow:0 2px 10px #bbb}
#loginPage h2{text-align:center;color:#2874f0;margin-bottom:20px}
#loginPage input{width:100%;padding:12px;margin:8px 0;
border:1px solid #ccc;border-radius:5px}
#loginPage button{width:100%;margin-top:10px}
.loginMsg{text-align:center;color:red;margin-top:10px}

#mainPage{display:none}

.search{display:flex;gap:10px;margin-bottom:20px}
.search input,.search select{padding:12px;border:1px solid #ccc;
border-radius:5px}
.search input{flex:1}

.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px}
.card{background:white;border-radius:8px;padding:15px;
box-shadow:0 2px 8px #ccc}
.card img{width:100%;height:150px;object-fit:cover;border-radius:6px}
.card h3{margin:10px 0;color:#222}
.price{color:#e53935;font-size:20px;font-weight:bold}
.location{color:#777;margin:7px 0}

.sell{background:white;padding:20px;margin-top:30px;
border-radius:8px;box-shadow:0 2px 8px #ccc}
.sell h2{text-align:center;margin-bottom:15px}
form{display:grid;gap:10px}
form input,form select,form textarea{padding:11px;
border:1px solid #ccc;border-radius:5px}
textarea{height:70px}

.logout{text-align:right;margin-bottom:15px}
.logout button{background:#e53935}

footer{text-align:center;background:#222;color:white;
padding:18px;margin-top:30px}
.noresult{text-align:center;color:#777;font-size:18px}
</style>
</head>

<body>

<header>
<h1>🛍️ UsedMart</h1>
<p>Buy and Sell Used Products Easily</p>
</header>

<!-- LOGIN PAGE -->
<div id="loginPage">
<h2>🔐 UsedMart Login</h2>

<form onsubmit="login(event)">
<input type="text" id="username" placeholder="Username" required>

<input type="password" id="password" placeholder="Password" required>

<button type="submit">Login</button>

<p class="loginMsg" id="loginMsg"></p>
</form>

<p style="text-align:center;margin-top:15px">
Demo: admin / 1234
</p>
</div>

<!-- MAIN PAGE -->
<div id="mainPage">

<nav>
<a href="#">Home</a>
<a href="#products">Products</a>
<a href="#sell">Sell Product</a>
</nav>

<div class="container">

<div class="logout">
<button onclick="logout()">Logout</button>
</div>

<div class="search">
<input type="text" id="search"
placeholder="Search products...">

<select id="category">
<option value="all">All Categories</option>
<option value="Electronics">Electronics</option>
<option value="Furniture">Furniture</option>
<option value="Vehicles">Vehicles</option>
<option value="Books">Books</option>
</select>

<button onclick="searchProducts()">Search</button>
</div>

<h2 id="products">Available Products</h2>
<br>

<div class="products" id="productList"></div>

<div class="sell" id="sell">
<h2>Sell Your Product</h2>

<form onsubmit="addProduct(event)">

<input type="text" id="name"
placeholder="Product Name" required>

<input type="number" id="price"
placeholder="Price ₹" required>

<select id="cat" required>
<option value="">Select Category</option>
<option value="Electronics">Electronics</option>
<option value="Furniture">Furniture</option>
<option value="Vehicles">Vehicles</option>
<option value="Books">Books</option>
</select>

<input type="text" id="location"
placeholder="Location" required>

<input type="url" id="image"
placeholder="Product Image URL" required>

<textarea id="description"
placeholder="Product Description" required></textarea>

<button type="submit">Post Advertisement</button>

</form>
</div>

</div>

<footer>
<p>© 2026 UsedMart | Classifieds Web Application</p>
</footer>

</div>

<script>

let products=[
{
name:"Used Laptop",
price:25000,
category:"Electronics",
location:"Salem",
image:"https://images.unsplash.com/photo-1496181133206-80ce9b88a853",
description:"Good condition laptop with 8GB RAM."
},
{
name:"Wooden Table",
price:4500,
category:"Furniture",
location:"Chennai",
image:"https://images.unsplash.com/photo-1533090481720-856c6e3c1fdc",
description:"Strong wooden study table."
},
{
name:"Honda Bike",
price:55000,
category:"Vehicles",
location:"Coimbatore",
image:"https://images.unsplash.com/photo-1558981806-ec527fa84c39",
description:"Well maintained used bike."
},
{
name:"Engineering Books",
price:1200,
category:"Books",
location:"Madurai",
image:"https://images.unsplash.com/photo-1495446815901-a7297e633e8d",
description:"Collection of engineering textbooks."
}
];


/* LOGIN */

function login(event){

event.preventDefault();

let username=document.getElementById("username").value;
let password=document.getElementById("password").value;

if(username=="admin" && password=="1234"){

document.getElementById("loginPage").style.display="none";
document.getElementById("mainPage").style.display="block";

displayProducts();

}
else{

document.getElementById("loginMsg").innerHTML=
"Invalid username or password";

}

}


/* LOGOUT */

function logout(){

document.getElementById("mainPage").style.display="none";
document.getElementById("loginPage").style.display="block";

document.getElementById("username").value="";
document.getElementById("password").value="";

}


/* DISPLAY PRODUCTS */

function displayProducts(list=products){

let box=document.getElementById("productList");

box.innerHTML="";

if(list.length==0){

box.innerHTML=
"<p class='noresult'>No products found.</p>";

return;

}

list.forEach((p,index)=>{

box.innerHTML+=`

<div class="card">

<img src="${p.image}" alt="${p.name}">

<h3>${p.name}</h3>

<p class="price">₹${p.price}</p>

<p><b>Category:</b> ${p.category}</p>

<p class="location">📍 ${p.location}</p>

<p>${p.description}</p>

<br>

<button onclick="contactSeller('${p.name}')">
Contact Seller
</button>

</div>

`;

});

}


/* SEARCH */

function searchProducts(){

let text=document.getElementById("search")
.value.toLowerCase();

let category=document.getElementById("category").value;

let result=products.filter(p=>{

let matchName=p.name
.toLowerCase()
.includes(text);

let matchCategory=
category=="all" || p.category==category;

return matchName && matchCategory;

});

displayProducts(result);

}


/* ADD PRODUCT */

function addProduct(event){

event.preventDefault();

let product={

name:document.getElementById("name").value,

price:document.getElementById("price").value,

category:document.getElementById("cat").value,

location:document.getElementById("location").value,

image:document.getElementById("image").value,

description:
document.getElementById("description").value

};

products.push(product);

displayProducts();

alert("Product advertisement posted successfully!");

document.querySelector("#sell form").reset();

document.getElementById("products")
.scrollIntoView();

}


/* CONTACT SELLER */

function contactSeller(name){

alert("You can contact the seller about: "+name);

}

</script>

</body>
</html>
